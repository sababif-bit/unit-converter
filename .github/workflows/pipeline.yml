name: Unit Converter CI/CD

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
    test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}

        - name: Cache pip
          uses: actions/cache@v4
          with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
            restore-keys: |
              ${{ runner.os }}-pip-

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

        - name: Run tests
          run: python -m pytest -v

        - name: Build package
          run: |
            mkdir -p build
            zip -r build/unit-converter.zip src README.md requirements.txt
        
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: unit-converter-package
            path: build/unit-converter.zip

    deploy:
      needs: test
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      environment: production
      permissions:
        contents: write
        actions: read

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: unit-converter-package
            path: build

        - name: Verify artifact
          run: ls -la build

        - name: Check deployment configuration
          env:
            DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
            DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          run: |
            echo "Deploy target: $DEPLOY_TARGET"
            echo "Token length: ${#DEPLOY_TOKEN}"

        - name: Create GitHub Release
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            gh release create "v1.0.${{ github.run_number }}" \
              --title "Release v1.0.${{ github.run_number }}" \
              --notes "Automated release from GitHub Actions" \
              build/unit-converter.zip